[project]
name = "distributed_learning"
version = "0.1.0"
description = "Experiments in centralized and distributed deep learning."
authors = [
    { name = "Max Frankenberg", email = "frankenbergmax57@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel",
    "ipywidgets",
    "matplotlib",
    "numpy",
    "pandas",
    "ray[tune]",
    "scikit-learn",
    "scipy",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.3.0",
    "pre-commit>=3.0.0",
    "marimo>=0.23.8",
    "ty>=0.0.73",
    "validate-pyproject>=0.23",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.12"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = ["distributed_learning"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "FIX",    # for comments like TODO, FIXME
    "TD",     # for structure of TODO comments
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "PGH003", # Use specific rule codes when ignoring type issues (simplified for ty)
    "COM812", # Trailing comma missing (conflicts with formatter)
    "ISC001", # Single line implicit string concatenation (conflicts with formatter)
    "N806",   # Variable in function should be lowercase (e.g. matrices in math/control)
    "N803",   # Argument name should be lowercase (e.g. matrices in math/control)
    "CPY",    # Missing copyright notices at top of file
]

[tool.ruff.lint.isort]
known-first-party = ["distributed_learning"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["INP001", "T201"]
"examples/**" = ["INP001", "B018", "ANN", "PLR0913", "PLR0917", "N803", "D", "T201"]
"tests/*" = ["S101", "PLR0913", "PLR0917", "F401", "ARG001", "PLR2004", "D", "INP001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -v"
testpaths = ["tests"]
markers = ["slow: marks tests as slow (deselected by default, opt-in with --runslow or -m slow)"]

[tool.ty]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
exclude = ["examples/**"]

[tool.ty.rules]
invalid-assignment = "error"
invalid-argument-type = "error"
invalid-return-type = "error"
unresolved-import = "error"
unresolved-attribute = "error"
unresolved-reference = "error"
possibly-missing-import = "error"
unused-ignore-comment = "warn"
unused-type-ignore-comment = "warn"
ignore-comment-unknown-rule = "warn"
index-out-of-bounds = "error"
division-by-zero = "error"
not-iterable = "error"
not-subscriptable = "error"
